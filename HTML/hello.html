<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            color: #0078D7;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #0078D7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>

    <h1>Welcome to HTML!</h1>
    <p>This page is running successfully in VS Code.</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("🎉 Congratulations! Your HTML is working.");
        }
    </script>

</body>
</html>
