
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Store</h1>
        <div>Cart: <span id="cart">0</span></div>
    </header>

    <h2>Our Products</h2>

    <div class="products">
        <div class="product">
            <h3>Laptop</h3>
            <p>Price: ₹50,000</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p>Price: ₹2,000</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <div class="product">
            <h3>Smartphone</h3>
            <p>Price: ₹20,000</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
